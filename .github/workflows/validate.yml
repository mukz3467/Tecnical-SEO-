name: Validate Technical SEO App

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "fix/**"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check server and frontend
        run: npm run lint
      - name: Build frontend
        run: npm run build
